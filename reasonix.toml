# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.config/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps         = 0   # executor tool-call rounds; 0 = no limit
planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan   = "off"   # off|on; off keeps plan mode manual
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[codegraph]
enabled      = true   # built-in MCP server; off by default for first-run sessions
auto_install = true   # fetch the runtime when CodeGraph is enabled but missing
# path       = ""   # empty = cache, then PATH, then a bundle beside reasonix

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "Tool" or "Tool(specifier)"; e.g. Bash(go test:*), Edit(src/**).
mode  = "ask"
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
allow = ["bash=cd \"E:\\测试\" && ls release/ 2>$null; echo \"---\"; ls *.exe 2>$null; echo \"---\"; cat package.json | Select-String -Pattern '\"version\"' | Select-Object -First 1", "bash=cd \"E:\\测试\" && cat build-nsis.js 2>$null | Select-Object -First 80", "bash=cd \"E:\\测试\" && if (Test-Path \"EngineeringManager.Api/bin/Release\") { ls \"EngineeringManager.Api/bin/Release/net8.0-windows/\" 2>$null | Select-Object -First 30 }", "bash=ls \"E:\\测试\\dist\" 2>$null", "bash=ls \"E:\\测试\\EngineeringManager.Api\\bin\\Release\\net8.0-windows\\\" 2>$null", "bash=ls \"E:\\测试\\EngineeringManager.Api\\bin\\Release\\net8.0-windows\\win-x64\\\" | Select-Object Name -First 30", "edit_file=E:\\测试\\EngineeringManager.Installer\\InstallerWindow.cs", "bash=cd \"E:\\测试\" && dotnet publish EngineeringManager.Installer -c Release -r win-x64 --self-contained -o \"release\" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true 2>&1", "bash=cd \"E:\\测试\\release\" && if (Test-Path \"EngineeringManager.Installer.exe\") { Move-Item \"EngineeringManager.Installer.exe\" \"工程管家-Setup.exe\" -Force; Remove-Item \"EngineeringManager.Installer.pdb\" -ErrorAction SilentlyContinue; Remove-Item \"Microsoft.Web.WebView2.*.xml\" -ErrorAction SilentlyContinue; ls \"工程管家-Setup.exe\" }", "bash=cd \"E:\\测试\\release\"; Move-Item \"EngineeringManager.Installer.exe\" \"工程管家-Setup.exe\" -Force -ErrorAction SilentlyContinue; Remove-Item \"EngineeringManager.Installer.pdb\" -ErrorAction SilentlyContinue; Remove-Item \"Microsoft.Web.WebView2.*.xml\" -ErrorAction SilentlyContinue; ls \"工程管家-Setup.exe\"", "bash=Get-Content \"$env:TEMP\\installer-log.txt\"", "edit_file=E:\\测试\\EngineeringManager.Api\\Endpoints\\InvoiceEndpoints.cs", "edit_file=E:\\测试\\EngineeringManager.Api\\Endpoints\\CostLedgerEndpoints.cs", "edit_file=E:\\测试\\EngineeringManager.Api\\Endpoints\\ProjectEndpoints.cs", "edit_file=E:\\测试\\EngineeringManager.Api\\Endpoints\\SystemEndpoints.cs", "bash=cd \"E:\\测试\\EngineeringManager.Api\" && dotnet build 2>&1 | Select-String -Pattern \"warning CS8602|warning CS8600|warning CS0168|warning CS1998|Build succeeded|Build FAILED\"", "bash=cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build 2>&1 | Select-String -Pattern \"(warning CS|Build succeeded|Build FAILED)\"", "bash=cd \"E:\\测试\\EngineeringManager.Api\" ; $result = dotnet build 2>&1 | Out-String ; Write-Output $result", "bash=Stop-Process -Id 25572 -Force -ErrorAction SilentlyContinue; cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build 2>&1 | Select-String -Pattern \"(warning CS|Build succeeded|Build FAILED)\"", "bash=cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build 2>&1 | Select-String -Pattern \"(warning CS|Build succeeded|error CS|生成成功|生成失败)\"", "bash=cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build 2>&1", "bash=cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build --no-restore 2>&1", "explore", "write_file=E:\\测试\\src\\components\\LoginSettingsModal.tsx", "bash=cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build --no-restore 2>&1 | Select-String -Pattern \"(warning|error|生成成功|生成失败|Build)\"", "bash=cd \"E:\\测试\" ; npx vite build 2>&1 | Select-String -Pattern \"(error|warning|FAIL|成功|succeeded|failed)\" -NotMatch \"vite|Rollup\"", "bash=cd \"E:\\测试\" ; npx vite build 2>&1", "bash=cd \"E:\\测试\" ; curl -s http://localhost:5048/api/cost-ledger/summary?projectId=1777366597762 2>&1", "bash=Stop-Process -Id 15444 -Force -ErrorAction SilentlyContinue; cd \"E:\\测试\\EngineeringManager.Api\" ; dotnet build --no-restore 2>&1", "edit_file=src/components/features/projects/ProjectCommandCenter.tsx", "run_skill", "mcp__codegraph__codegraph_context", "mcp__codegraph__codegraph_search", "mcp__codegraph__codegraph_files", "mcp__codegraph__codegraph_explore"]
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit)
# may only write under workspace_root (empty = current dir) + allow_write.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
# ${VAR} / ${VAR:-default} are expanded from the environment in command/args/env/url/headers.
