<!DOCTYPE html>
<html lang="zh-CN" data-theme="sandstone">
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工程管家 - 工程项目管理系统</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script>
      // 首帧就要拿到用户主题（KEY 与 src/hooks/useTheme.ts 一致），否则会闪一下默认主题
      try {
        var t = localStorage.getItem('app-theme')
        document.documentElement.setAttribute('data-theme', t === 'white' || t === 'graphite' || t === 'sandstone' ? t : 'sandstone')
      } catch (e) {}
    </script>
    <style>
      /* 首帧早于 CSS bundle，以下变量镜像 src/index.css 的 token —— 两处必须同步 */
      :root { --brand: oklch(65% 0.13 60); }
      :root,
      [data-theme="white"] {
        --bg: oklch(98.6% 0.009 85);
        --fg: oklch(23% 0.014 70);
      }
      [data-theme="graphite"] {
        --bg: oklch(20.5% 0.003 75);
        --fg: oklch(86% 0.003 80);
      }
      [data-theme="sandstone"] {
        --bg: oklch(98.8% 0 0);
        --fg: oklch(24% 0 0);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background-color: var(--bg);
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      /* 极简加载占位 — 与 React SplashScreen 无缝过渡 */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: var(--bg);
      }
      .app-loading-logo {
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        opacity: 0.6;
      }
      .app-loading-dots {
        display: flex;
        gap: 8px;
      }
      .app-loading-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .app-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .app-loading-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
      }
    </style>
    <script>window.__APP_VERSION__ = '<APP_VERSION>'</script>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <!-- Logo 三角形 — 与 SplashScreen 一致 -->
        <svg class="app-loading-logo" viewBox="0 0 18 18" fill="none">
          <defs>
            <mask id="loading-mask"><rect width="18" height="18" fill="white" /><path d="M5 14 L9 6 L13 14 Z" fill="black" /></mask>
          </defs>
          <path d="M2 15.5 L9 2.5 L16 15.5 Z" fill="var(--brand)" mask="url(#loading-mask)" />
        </svg>
        <!-- 脉冲点 -->
        <div class="app-loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
