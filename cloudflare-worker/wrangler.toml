# =====================================================================
# 工程管家 - 错误上报 Worker 部署配置
# 重建说明：本文件从线上 Worker 的 bindings 快照还原（见 worker-settings.json）
# 若只是恢复功能：线上 Worker 仍在运行，前端指向 worker URL 即可，无需重新部署本目录。
# 若需重新部署/修改 Worker：在 cloudflare-worker/ 下执行 npx wrangler deploy
# =====================================================================
name = "engineering-manager-crash"
main = "index.js"
compatibility_date = "2026-06-01"
usage_model = "standard"

# D1 数据库（错误报告与聚合存储）
# database_name 仅用于 wrangler 索引，以 database_id 为真源
[[d1_databases]]
binding = "DB"
database_id = "0f7bed6e-c52e-4bc0-9fb5-2f333fbe33ec"

# 速率限制（每个 IP 每 60 秒最多 10 次上报请求）
# ratelimit 类型的 binding 只能在 unsafe.bindings 中声明（wrangler 限制）
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 静态资源（报错控制台面板）—— Vite 构建产物 dashboard-dist/
# SPA fallback：未命中静态文件的路径回退到 index.html（面板用 hash 路由）
# run_worker_first：以下 Worker 路由优先交给 Worker 处理，不命中静态资源
[assets]
directory = "./dashboard-dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*", "/stats", "/stats/*", "/login", "/register", "/logout"]
