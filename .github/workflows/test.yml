name: Tests

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'perf/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Run tests
        run: npm run test
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            *.xml

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run check

      - name: Version consistency check
        # 版本引用一致性只读门禁（真源 package.json）→ docs/VERSIONING.md「版本号引用位置」
        run: npm run check:version

  backend:
    name: Backend Build & Test (.NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Backend redline static scan
        # AGENTS.md 后端红线机械化门禁：SQL 参数化 / 端点鉴权覆盖 / catch 日志棘轮
        run: node scripts/check-backend-rules.cjs

      - name: Build backend API
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: Run backend tests
        # 排除需外部资源的可选端到端测试（CI 无法提供，测试文件自身注明选择性运行）：
        #   SttE2ETests    — GB 级 ASR 模型 + 真实转写子进程
        #   BgeE2ETests    — 真实 BGE 嵌入模型（未纳入版本库）
        #   RealHttp       — Agent 真实 LLM HTTP 调用（需 API key / 网络）
        run: dotnet test EngineeringManager.Tests/EngineeringManager.Tests.csproj --filter "FullyQualifiedName!~SttE2ETests&FullyQualifiedName!~BgeE2ETests&FullyQualifiedName!~RealHttp"

  e2e:
    name: E2E Critical Paths (Playwright)
    runs-on: windows-latest

    env:
      # 数据目录隔离：走 ResolveDataPath() 的环境变量最高优先级，首启自动建库 + seed 默认 admin
      ENGINEERING_MANAGER_DATA_PATH: ${{ github.workspace }}\.e2e-data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Restore backend API
        run: dotnet restore EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: Build backend API (Release)
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj --configuration Release --no-restore

      - name: Start API (--api-only, isolated data path)
        run: |
          New-Item -ItemType Directory -Force -Path $env:ENGINEERING_MANAGER_DATA_PATH | Out-Null
          $apiDir = Join-Path $env:GITHUB_WORKSPACE 'EngineeringManager.Api\bin\Release\net8.0-windows'
          # WorkingDirectory 固定到输出目录：content root 取进程当前目录，确保 appsettings.json 可加载
          $process = Start-Process -FilePath dotnet -WorkingDirectory $apiDir -ArgumentList 'EngineeringManager.Api.dll','--api-only' -RedirectStandardOutput (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.log') -RedirectStandardError (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.err.log') -PassThru
          $process.Id | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.pid')

      - name: Wait for API health (max 240s)
        run: |
          $apiPid = [int](Get-Content (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.pid'))
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $deadline = 240
          $ok = $false
          while ($sw.Elapsed.TotalSeconds -lt $deadline) {
            # 进程存活检查：PID 不存在即 API 已提前退出，立即输出日志并失败，不等满 deadline
            if ($null -eq (Get-Process -Id $apiPid -ErrorAction SilentlyContinue)) {
              Write-Output "API 进程 (PID $apiPid) 已提前退出，输出日志后立即失败"
              Get-Content api-e2e.log, api-e2e.err.log -ErrorAction SilentlyContinue
              throw "API 进程提前退出 (PID $apiPid)，未达 readiness"
            }
            try {
              if ((Invoke-WebRequest -Uri http://localhost:5048/api/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          $sw.Stop()
          if ($ok) {
            Write-Output ("API readiness 实际耗时: {0:N1}s (PID {1})" -f $sw.Elapsed.TotalSeconds, $apiPid)
          } else {
            $alive = $null -ne (Get-Process -Id $apiPid -ErrorAction SilentlyContinue)
            Write-Output ("API 未在 {0}s 内就绪；PID {1} 仍存活: {2}" -f $deadline, $apiPid, $alive)
            Get-Content api-e2e.log, api-e2e.err.log -ErrorAction SilentlyContinue
            throw "API 未在 ${deadline}s 内就绪 (http://localhost:5048/api/health)"
          }

      - name: Run E2E critical paths
        # 纯 request 级用例，无需 playwright install 浏览器二进制（已验证）
        # list reporter 失败时直接标出具体用例与断言位置，不静默跳过
        run: npx playwright test e2e/critical-paths.spec.ts --reporter=list

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            api-e2e.log
            api-e2e.err.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Full Build (Frontend + Backend)
    runs-on: windows-latest
    needs: [test, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend (Vite)
        run: npx vite build

      - name: Build backend (.NET)
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-output
          path: EngineeringManager.Api/bin/Debug/net8.0-windows/
          retention-days: 7
