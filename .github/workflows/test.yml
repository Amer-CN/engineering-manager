name: Tests

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'perf/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Run tests
        run: npm run test
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            *.xml

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run check

      - name: Version consistency check
        # 版本引用一致性只读门禁（真源 package.json）→ docs/VERSIONING.md「版本号引用位置」
        run: npm run check:version

  backend:
    name: Backend Build & Test (.NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Backend redline static scan
        # AGENTS.md 后端红线机械化门禁：SQL 参数化 / 端点鉴权覆盖 / catch 日志棘轮
        run: node scripts/check-backend-rules.cjs

      - name: Build backend API
        # G2 B1 0 警告固化：-warnaserror 把任何编译器警告升为错误，机械强制「0 错误 0 警告」红线
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj -warnaserror

      - name: Run backend tests
        # 排除需外部资源的可选端到端测试（CI 无法提供，测试文件自身注明选择性运行）：
        #   SttE2ETests    — GB 级 ASR 模型 + 真实转写子进程
        #   BgeE2ETests    — 真实 BGE 嵌入模型（未纳入版本库）；前缀 !~BgeE2ETests 连带覆盖 BgeE2ETestsV2
        #                    （M-FIX2 X4 回滚：M-FIX1 F7 曾加 !~BgeE2ETestsV2 伪装条目——前缀已覆盖，删除之）
        #   RealHttp       — Agent 真实 LLM HTTP 调用（需 API key / 网络）
        # M-FIX2 X4 回滚：!~M2FourthRoundTests.Model_ 已移除——F7 前 master CI 实测 Model_* 全绿
        #   （run 31096559390 失败全是 vitest 15 红，Model_* 0 失败），F7 排掉它们是砍覆盖。
        # H-4: -warnaserror 让 Tests 项目警告同样被 CI 机械拦截（此前只拦 API 项目）
        run: dotnet test EngineeringManager.Tests/EngineeringManager.Tests.csproj -warnaserror --filter "FullyQualifiedName!~SttE2ETests&FullyQualifiedName!~BgeE2ETests&FullyQualifiedName!~RealHttp"

  e2e:
    name: E2E Critical Paths (Playwright)
    runs-on: windows-latest

    env:
      # 数据目录隔离：走 ResolveDataPath() 的环境变量最高优先级，首启自动建库 + seed 默认 admin
      ENGINEERING_MANAGER_DATA_PATH: ${{ github.workspace }}\.e2e-data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Restore backend API
        run: dotnet restore EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: Build backend API (Release)
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj --configuration Release --no-restore -warnaserror

      - name: Run API and E2E critical paths
        run: |
          New-Item -ItemType Directory -Force -Path $env:ENGINEERING_MANAGER_DATA_PATH | Out-Null
          $stdoutPath = Join-Path $env:GITHUB_WORKSPACE 'api-e2e.log'
          $stderrPath = Join-Path $env:GITHUB_WORKSPACE 'api-e2e.err.log'
          $apiDir = Join-Path $env:GITHUB_WORKSPACE 'EngineeringManager.Api\bin\Release\net8.0-windows'

          $process = $null
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()

          try {
            # WorkingDirectory 固定到输出目录：content root 取进程当前目录，确保 appsettings.json 可加载
            $process = Start-Process -FilePath dotnet -WorkingDirectory $apiDir -ArgumentList 'EngineeringManager.Api.dll','--api-only' -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru

            $deadline = (Get-Date).AddSeconds(240)
            $ready = $false

            while ((Get-Date) -lt $deadline) {
              $process.Refresh()

              if ($process.HasExited) {
                throw "API 进程提前退出，exitCode=$($process.ExitCode)"
              }

              try {
                $response = Invoke-WebRequest -Uri 'http://localhost:5048/api/health' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              }
              catch {
                # 健康检查尚未就绪，继续主动轮询
              }

              Start-Sleep -Seconds 1
            }

            if (-not $ready) {
              throw "API 未在 240 秒内就绪"
            }

            Write-Host "API readiness: $([math]::Round($stopwatch.Elapsed.TotalSeconds, 1))s"

            # 纯 request 级用例，无需 playwright install 浏览器二进制（已验证）
            # list reporter 失败时直接标出具体用例与断言位置，不静默跳过
            & npx playwright test e2e/critical-paths.spec.ts --reporter=list

            if ($LASTEXITCODE -ne 0) {
              throw "Playwright critical paths failed，exitCode=$LASTEXITCODE"
            }
          }
          catch {
            Write-Host "===== api-e2e.log ====="
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath }

            Write-Host "===== api-e2e.err.log ====="
            if (Test-Path $stderrPath) { Get-Content $stderrPath }

            throw
          }
          finally {
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                # 结束整个进程树，防止后台 worker 残留
                & taskkill.exe /PID $process.Id /T /F
              }
            }
          }

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            api-e2e.log
            api-e2e.err.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Full Build (Frontend + Backend)
    runs-on: windows-latest
    needs: [test, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend (Vite)
        run: npx vite build

      - name: Build backend (.NET)
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj -warnaserror

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-output
          path: EngineeringManager.Api/bin/Debug/net8.0-windows/
          retention-days: 7
