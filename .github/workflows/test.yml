name: Tests

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'perf/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false  # A2: 矩阵取消方向翻转过两次，关掉 fail-fast 让两条 node 都跑完
      matrix:
        node-version: [20, 22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Run tests
        run: npm run test
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            *.xml

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run check

      - name: Version consistency check
        # 版本引用一致性只读门禁（真源 package.json）→ docs/VERSIONING.md「版本号引用位置」
        run: npm run check:version

  backend-redline:
    # 28.3: static scan 独立成 job——它红不再短路 backend 的 build + dotnet test。
    # TD-BACKEND-28 预存 28 项红线违规，短期不修；此前它挡在 backend job 第一步，
    # 导致 Run backend tests 永远 skipped（18 个新后端测试在 CI 上从未运行过）。
    name: Backend Redline Static Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Backend redline static scan
        # AGENTS.md 后端红线机械化门禁：SQL 参数化 / 端点鉴权覆盖 / catch 日志棘轮
        # R7.6(G15): TD-BACKEND-28 棘轮在 CI 生效——退出码 1（= 登记基线 28）允许，
        # 退出码 2（棘轮破坏：违规数 != 28）视为失败。
        shell: bash
        run: |
          # R8.3(G22): 显式捕获 node 退出码（if-cmd 后取 $? 语义含歧义）——
          # code=0 初始化 + `|| code=$?`：0 真绿 / 1 登记红（允许）/ 2 棘轮破坏（失败）
          code=0
          node scripts/check-backend-rules.cjs || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::notice::Registered red baseline (TD-BACKEND-28, expected count in scripts/backend-redline-count.json). Allowed."
            exit 0
          fi
          exit "$code"

  backend:
    name: Backend Build & Test (.NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build backend API
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: Run backend tests
        # 排除需外部资源的可选端到端测试（CI 无法提供，测试文件自身注明选择性运行）：
        #   SttE2ETests    — GB 级 ASR 模型 + 真实转写子进程
        #   BgeE2ETests    — 真实 BGE 嵌入模型（未纳入版本库）——注意 !~BgeE2ETests 同时
        #                   排除 BgeE2ETestsV2（E2E_RealBge，CI 上从未执行过）
        #   RealHttp       — Agent 真实 LLM HTTP 调用（需 API key / 网络）
        #   M2 Model_* ×5  — R3.2 并入：与 BgeE2ETests 同族（需真实 BGE 模型文件预存在）。
        #                   根因/证据/解除条件见 FREEZE-CONTRACT.md TD-M2-REALMODEL。
        #                   精确到 5 条依赖模型的测试；Model_MissingModel_StatusUnavailable
        #                   与 Model_DownloadInterrupted_NoFinalFile 不依赖模型，继续在 CI 执行。
        run: dotnet test EngineeringManager.Tests/EngineeringManager.Tests.csproj --filter "FullyQualifiedName!~SttE2ETests&FullyQualifiedName!~BgeE2ETests&FullyQualifiedName!~RealHttp&FullyQualifiedName!~M2FourthRoundTests.Model_ConcurrentEnsure_Only1Download&FullyQualifiedName!~M2FourthRoundTests.Model_CorruptModelFile_SelfHealAndRedownload&FullyQualifiedName!~M2FourthRoundTests.Model_CorruptVocab_SelfHealAndRedownload&FullyQualifiedName!~M2FourthRoundTests.Model_ResidualTmpFile_CleanedBeforeDownload&FullyQualifiedName!~M2FourthRoundTests.Model_ResetAfterHeal_EnterReady"

  e2e:
    name: E2E Critical Paths (Playwright)
    runs-on: windows-latest

    env:
      # 数据目录隔离：走 ResolveDataPath() 的环境变量最高优先级，首启自动建库 + seed 默认 admin
      ENGINEERING_MANAGER_DATA_PATH: ${{ github.workspace }}\.e2e-data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Build backend API
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: E2E (start API + wait + run in one step)
        # A1: GitHub Actions runner 在步骤结束时清理该步骤启动的子进程（2026-08 行为），
        # 跨步骤的 API 进程必死（0 字节日志 + 端口永不监听）。
        # 解法：启动 + 等待 + Playwright 全部合并进一个步骤，进程生命周期完全在步骤内。
        run: |
          New-Item -ItemType Directory -Force -Path $env:ENGINEERING_MANAGER_DATA_PATH | Out-Null
          $apiDir = Join-Path $env:GITHUB_WORKSPACE 'EngineeringManager.Api\bin\Debug\net8.0-windows'
          $apiProc = Start-Process -FilePath dotnet -WorkingDirectory $apiDir -ArgumentList 'EngineeringManager.Api.dll','--api-only' -RedirectStandardOutput (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.log') -RedirectStandardError (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.err.log') -PassThru
          Write-Host "API started PID=$($apiProc.Id)"
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              if (-not (Get-Process -Id $apiProc.Id -ErrorAction SilentlyContinue)) {
                Write-Host "API process exited early (PID $($apiProc.Id)); logs:"
                Get-Content api-e2e.log, api-e2e.err.log -ErrorAction SilentlyContinue
                throw "API process exited before ready; see api-e2e.err.log above"
              }
              try {
                if ((Invoke-WebRequest -Uri http://localhost:5048/api/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ok) {
              Write-Host 'API 未在 180s 内就绪；日志：'
              Get-Content api-e2e.log, api-e2e.err.log -ErrorAction SilentlyContinue
              throw 'API 未在 180s 内就绪 (http://localhost:5048/api/health)'
            }
            # 纯 request 级用例，无需 playwright install 浏览器二进制（已验证）
            npx playwright test e2e/critical-paths.spec.ts --reporter=list
            if ($LASTEXITCODE -ne 0) { throw "playwright exit code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $apiProc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            api-e2e.log
            api-e2e.err.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Full Build (Frontend + Backend)
    runs-on: windows-latest
    needs: [test, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend (Vite)
        run: npx vite build

      - name: Build backend (.NET)
        run: dotnet build EngineeringManager.Api/EngineeringManager.Api.csproj

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-output
          path: EngineeringManager.Api/bin/Debug/net8.0-windows/
          retention-days: 7
